# Fly.io: one small machine with a disk for the database and media.
# First time:  fly launch --no-deploy --copy-config --name <your-app>
#              fly volumes create soulscape_data --region yyz --size 10
#              fly secrets set SUPER_ADMIN_EMAIL=you@example.com SUPER_ADMIN_PASSWORD='a long passphrase'
#              fly deploy
# Every update after that: fly deploy
app = "soulscape"
primary_region = "yyz"

[env]
  NODE_ENV = "production"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[mounts]
  source = "soulscape_data"
  destination = "/data"
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
